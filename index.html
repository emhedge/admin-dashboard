<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <div id="main-page">
        <header id="header">
            <div id="header-top-row">
                <div id="search">
                    <div class="header" id="search-icon"><img src="images/database-search.svg" alt="Search icon" style="width:24px;height:24px"> </div>
                    <input class="header" id="search-bar" type="search">
                </div>
                <div id="user-nav">
                    <div id="notifications"><img src="images/bell-ring.svg" alt="Notifications icon" style="width:24px;height:24px"></div>
                    <div id="user-icon"><img src="images/wild-boar-svgrepo-com.svg" style="width:60px;height:60px"></div>
                    <div class="header" id="username">Morgan Oakley</div>
                </div>
            </div>
            <div id="header-bottom-row">
                <div id="user-greeting">
                    <div id="bottom-row-user-icon"><img src="images/wild-boar-svgrepo-com.svg" alt="" style="width:90px;height:90px"></div>
                    <div id="greeting-username">
                        <div id="bottom-row-greeting">Hi there,</div>
                        <div id="bottom-row-username">Morgan Oakley (@morgan)</div>
                    </div>
                </div>
                <div id="user-buttons">
                    <button class="header-button" id="new">New</button>
                    <button class="header-button" id="upload">Upload</button>
                    <button class="header-button" id="share">Share</button>
                </div>
            </div>
        </header>
        <div id="sidebar">
            <div id="sidebar-top">
                <img src="images/pig-variant.svg" alt="Pig icon - Dashboard" style="width:36px;height:36px"><p>TRUFFLE</p>
            </div>
            <div id="sidebar-navigation">
                <a><img src="images/home-variant-outline.svg" alt="Home icon" style="width:24px;height:24px">Home</a>
                <a><img src="images/account-circle-outline.svg" alt="Profile icon" style="width:24px;height:24px">Profile</a>
                <a><img src="images/chat-question-outline.svg" alt="Messages icon" style="width:24px;height:24px">Messages</a>
                <a><img src="images/history.svg" alt="History icon" style="width:24px;height:24px">History</a>
                <a><img src="images/note-multiple-outline.svg" alt="Tasks icon" style="width:24px;height:24px">Tasks</a>
                <a><img src="images/account-group-outline.svg" alt="Communities icon" style="width:24px;height:24px">Communities</a>
            </div>
            <div id="sidebar-branding">
                <a><img src="images/cog-outline.svg" alt="Settings icon" style="width:24px;height:24px">Settings</a>
                <a><img src="images/chat-question-outline.svg" alt="Support icon" style="width:24px;height:24px">Support</a>
                <a><img src="images/shield-lock-outline.svg" alt="Privacy icon" style="width:24px;height:24px">Privacy</a>
            </div>
        </div>
        <div id="main-content">
            <div class="main-content" id="projects">
                <div class="main-content" id="project-title">Projects</div>
                <div id="project-cards">
                    <div class="project-card" id="project-1">
                        <div id="card-content">
                            <h3></h3>
                            <p></p>
                        </div>
                        <div id="card-buttons"></div>
                    </div>
                    <div class="project-card" id="project-2">
                        <div id="card-content">
                            <h3></h3>
                            <p></p>
                        </div>
                        <div id="card-buttons"></div>
                    </div>
                    <div class="project-card" id="project-3">
                        <div id="card-content">
                            <h3></h3>
                            <p></p>
                        </div>
                        <div id="card-buttons"></div>
                    </div>
                    <div class="project-card" id="project-4">
                        <div id="card-content">
                            <h3></h3>
                            <p></p>
                        </div>
                        <div id="card-buttons"></div>
                    </div>
                    <div class="project-card" id="project-5">
                        <div id="card-content">
                            <h3></h3>
                            <p></p>
                        </div>
                        <div id="card-buttons"></div>
                    </div>
                    <div class="project-card" id="project-6">
                        <div id="card-content">
                            <h3></h3>
                            <p></p>
                        </div>
                        <div id="card-buttons"></div>
                    </div>
                </div>
            </div>
            <div class="main-content" id="announcements">
                <div class="main-content" id="announcements-title">Announcements</div>
                <div id="announcements-card">
                    <div class="announcement-content" id="announcement-1">
                        <h3></h3>
                        <p></p>
                    </div>
                    <div class="announcement-content" id="announcement-2">
                        <h3></h3>
                        <p></p>
                    </div>
                    <div class="announcement-content" id="announcement-3">
                        <h3></h3>
                        <p></p>
                    </div>
                
                </div>
            </div>
            <div class="main-content" id="trending">
                <div class="main-content" id="trending-title">Trending</div>
                <div id="trending-card">
                    <div id="trending-1">
                        <div id="trending-icon"></div>
                        <div id="trending-content"></div>
                    </div>
                    <div id="trending-2">
                        <div id="trending-icon"></div>
                        <div id="trending-content"></div>
                    </div>
                    <div id="trending-3">
                        <div id="trending-icon"></div>
                        <div id="trending-content"></div>
                    </div>
                    <div id="trending-4">
                        <div id="trending-icon"></div>
                        <div id="trending-content"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    
    
    
</body>
</html>
